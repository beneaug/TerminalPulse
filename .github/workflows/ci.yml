name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  server:
    name: Server Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Compile Python
        run: python -m compileall server

      - name: Run Unit Tests
        run: python -m unittest discover -s server/tests -p "test_*.py" -v

  apple:
    name: Apple Builds
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test networking, refresh policy, and models
        run: swift test

      - name: Build iOS App (Debug)
        run: |
          xcodebuild \
            -project TerminalPulse/TerminalPulse.xcodeproj \
            -scheme TerminalPulse \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build watchOS App (Debug)
        run: |
          xcodebuild \
            -project TerminalPulse/TerminalPulse.xcodeproj \
            -scheme TerminalPulseWatch \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS App (Release)
        run: |
          xcodebuild \
            -project TerminalPulse/TerminalPulse.xcodeproj \
            -scheme TerminalPulse \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build watchOS App (Release)
        run: |
          xcodebuild \
            -project TerminalPulse/TerminalPulse.xcodeproj \
            -scheme TerminalPulseWatch \
            -configuration Release \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test app lifecycle, reading consistency, and local purchases
        timeout-minutes: 12
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,devices in d["devices"].items() if ".iOS-" in runtime for x in devices if x["name"].startswith("iPhone")))')
          mkdir -p TestResults
          xcodebuild -version
          xcrun simctl bootstatus "$simulator_id" -b
          xcodebuild \
            -project TerminalPulse/TerminalPulse.xcodeproj \
            -scheme TerminalPulse \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -only-testing:TmuxAppTests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 120 \
            -resultBundlePath TestResults/AppTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            test

      - name: Preserve app-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 7
