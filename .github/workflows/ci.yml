name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  server:
    name: Server Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server dependencies
        run: python -m pip install -r server/requirements.txt

      - name: Compile Python
        run: python -m compileall server

      - name: Run Unit Tests
        run: python -m unittest discover -s server/tests -p "test_*.py" -v

  apple:
    name: Apple Builds
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test networking, refresh policy, and models
        run: swift test

      - name: Build iOS App (Debug)
        run: |
          xcodebuild \
            -project TerminalPulse/TerminalPulse.xcodeproj \
            -scheme TerminalPulse \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build watchOS App (Debug)
        run: |
          xcodebuild \
            -project TerminalPulse/TerminalPulse.xcodeproj \
            -scheme TerminalPulseWatch \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build iOS App (Release)
        run: |
          xcodebuild \
            -project TerminalPulse/TerminalPulse.xcodeproj \
            -scheme TerminalPulse \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build watchOS App (Release)
        run: |
          xcodebuild \
            -project TerminalPulse/TerminalPulse.xcodeproj \
            -scheme TerminalPulseWatch \
            -configuration Release \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
